name: Splitter

# The Splitter driver (splitter/), apart from BananaSplit's own CI.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: splitter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  splitter-rules:
    name: Splitter cable rules
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Ring and format tests
        working-directory: splitter/windows
        run: |
          c++ -std=c++17 -O2 -Wall -Wextra -Werror -o "$RUNNER_TEMP/cablerule_test" tests/cablerule_test.cpp
          "$RUNNER_TEMP/cablerule_test" | tee "$RUNNER_TEMP/cablerule.log" || {
            grep '^FAIL' "$RUNNER_TEMP/cablerule.log" | head -n 20 | sed 's/^/::error::/'
            exit 1
          }

  splitter-windows:
    name: Splitter (Windows driver)
    # The image Microsoft's Windows-driver-samples CI builds with.
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build, check, test-sign and package
        shell: pwsh
        run: |
          try {
            ./splitter/windows/build.ps1
          } catch {
            Write-Output "::error::Splitter build: $($_.Exception.Message)"
            throw
          }

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: splitter-windows-x64
          path: splitter/windows/dist/*.zip
          if-no-files-found: error
          retention-days: 14
