name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: linux

      - name: Build
        run: cargo build --locked --release

      - name: Unit tests
        run: cargo test --locked

      - name: End-to-end tests
        run: sh tests/e2e/run_e2e.sh

      - name: Build and check packages
        run: sh packaging/build-packages.sh

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: bananasplit-linux-x86_64
          path: linux/dist/*
          if-no-files-found: error
          retention-days: 14

  linux-window:
    name: Linux window and tray
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb dbus libgtk-3-dev python3-dbus python3-gi gir1.2-gtk-3.0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: linux

      - name: Build
        run: cargo build --locked --release

      - name: Window and tray tests
        env:
          PYTHON: /usr/bin/python3
        run: sh tests/window/run_window_test.sh

  linux-gui:
    name: Linux GUI (Playwright)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: linux

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        run: cargo build --locked --release

      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium

      # The page's first-choice font. Without it Chromium falls back to
      # DejaVu Sans, which is too wide for the name-fitting checks.
      - name: Install fonts
        run: sudo apt-get install -y --no-install-recommends fonts-inter

      - name: Build mock JACK server
        run: gcc -shared -fPIC -O2 -o tests/e2e/libjack.so.0 tests/e2e/mockjack.c -lpthread -lm

      - name: GUI tests
        run: node tests/gui/ui_check.js

  windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows

      - name: Build
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --locked --release --target x86_64-pc-windows-msvc

      - name: Unit tests
        run: cargo test --locked

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: bananasplit-windows-x64
          path: windows/target/x86_64-pc-windows-msvc/release/bananasplit.exe
          if-no-files-found: error
          retention-days: 14


  splitter-rules:
    name: Splitter cable rules
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Ring and format tests
        working-directory: splitter/windows
        shell: bash
        run: |
          c++ -std=c++17 -O2 -Wall -Wextra -Werror -o "$RUNNER_TEMP/cablerule_test" tests/cablerule_test.cpp
          "$RUNNER_TEMP/cablerule_test" | tee "$RUNNER_TEMP/cablerule.log" || {
            grep '^FAIL' "$RUNNER_TEMP/cablerule.log" | head -n 20 | sed 's/^/::error::/'
            exit 1
          }

  splitter-windows:
    name: Splitter (Windows driver)
    # The image Microsoft's Windows-driver-samples CI builds with.
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build, check, test-sign and package
        shell: pwsh
        run: |
          try {
            ./splitter/windows/build.ps1
          } catch {
            Write-Output "::error::Splitter build: $($_.Exception.Message)"
            throw
          }

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: splitter-windows-x64
          path: splitter/windows/dist/*.zip
          if-no-files-found: error
          retention-days: 14

  windows-launch:
    name: Windows launch
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: bananasplit-windows-x64
          path: dist

      - name: Start, open, restart and quit the app
        shell: pwsh
        run: ./windows/tests/launch/smoke.ps1 -Exe dist/bananasplit.exe

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-launch-screenshots
          path: ${{ runner.temp }}/bs-smoke/*.png
          if-no-files-found: ignore
          retention-days: 14
